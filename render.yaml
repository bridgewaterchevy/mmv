# Render Blueprint for MMV (Match My Vibe)
# Spec: https://render.com/docs/blueprint-spec
#
# One free Node web service. Postgres + file storage live on Supabase (not Render),
# so there is no `databases:` section here. Secrets are declared with `sync: false`,
# which makes the Render dashboard prompt for their values when the Blueprint is first
# deployed (they are never stored in this file).
services:
  - type: web
    name: mmv
    runtime: node
    plan: free              # 0.1 CPU / 512 MB; spins down after 15 idle minutes
    region: oregon          # or: ohio
    # --include=dev is required: NODE_ENV=production (below) is also set at build time, and
    # npm then skips devDependencies (vite/esbuild/tsx live there). See
    # https://docs.npmjs.com/cli/v10/commands/npm-ci (omit/include) and
    # https://community.render.com/t/nextjs-13-build-failing-error-cannot-find-module-tailwindcss/14503
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeployTrigger: commit   # redeploy on every push to the linked branch
    envVars:
      - key: NODE_VERSION
        value: "20"          # Node major used for development; Render resolves to latest 20.x
      - key: NODE_ENV
        value: production
      - key: SUPABASE_BUCKET
        value: outfits
      # Database: paste ONLY the password into SUPABASE_DB_PASSWORD. The app assembles the URL.
      # Host/user come from Supabase -> Connect -> "Session pooler" (IPv4-proxied for free).
      - key: SUPABASE_DB_HOST
        value: aws-0-us-east-1.pooler.supabase.com
      - key: SUPABASE_DB_PORT
        value: "5432"
      - key: SUPABASE_DB_USER
        value: postgres.sfvtipxgzozjvlvbvhvj
      - key: SUPABASE_DB_PASSWORD
        sync: false          # Supabase database password. SECRET. (Alternative: set DATABASE_URL instead.)
      - key: SUPABASE_URL
        value: https://sfvtipxgzozjvlvbvhvj.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false          # Supabase secret key (sb_secret_...) or legacy service_role JWT. SECRET.
      - key: GEMINI_API_KEY
        sync: false          # Google AI Studio key. SECRET.
      # Shopping prices + affiliate links (optional; the app works without them, offers are just empty)
      - key: SERPAPI_KEY
        sync: false          # SerpApi private key (Google Shopping prices). SECRET.
      - key: HASDATA_API_KEY
        sync: false          # HasData key, fallback shopping provider. SECRET. Leave blank to skip.
      - key: PRICE_LOOKUPS_PER_DAY
        value: "8"          # provider calls per UTC day incl. direct-link resolves (8/day ≈ 240/month fits the free SerpApi plan; 24h cache keeps real usage lower)
      - key: PRICE_DIRECT_RESOLVE_PER_ITEM
        value: "1"           # Immersive Product resolves per item for offers lacking a merchant link (1 budget unit each)
      - key: SOVRN_API_KEY
        sync: false          # Sovrn Commerce API key; wraps retailer links for commission. SECRET.
      - key: AMAZON_ASSOCIATES_TAG
        sync: false          # Amazon Associates tracking id (e.g. yourstore-20). Not secret, but account-specific.
